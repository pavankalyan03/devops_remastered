name: Deploy Migrations

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'
    environment: dev
    name: Deploy to DEV
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Create connections.toml dynamically
        run: |
          cat <<EOT > "$GITHUB_WORKSPACE/bronze/migrations/connections.toml"
          [snowflake]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          password = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          EOT

          cp "$GITHUB_WORKSPACE/bronze/migrations/connections.toml" "$GITHUB_WORKSPACE/silver/migrations/"
          cp "$GITHUB_WORKSPACE/bronze/migrations/connections.toml" "$GITHUB_WORKSPACE/gold/migrations/"

      - name: Debug connections.toml content per layer
        run: |
          for layer in bronze silver gold; do
            echo "connections.toml content for $layer:"
            cat "$GITHUB_WORKSPACE/$layer/migrations/connections.toml"
            echo
          done

      - name: Run migrations for bronze, silver, gold layers
        run: |
          for layer in bronze silver gold; do
            echo "Dry-run migrations for $layer in DEV schema"
            schemachange deploy -c "$GITHUB_WORKSPACE/$layer/migrations/config/schemachange-config.yml" --dry-run --change-history-table APP_DB.DEV.CHANGE_HISTORY --query-tag "schemachange-dev"
            echo "Running migrations for $layer in DEV schema"
            schemachange deploy -c "$GITHUB_WORKSPACE/$layer/migrations/config/schemachange-config.yml" --change-history-table APP_DB.DEV.CHANGE_HISTORY --query-tag "schemachange-dev"
          done

  deploy-test:
    runs-on: ubuntu-latest
    if: github.ref_name == 'test'
    environment: test
    name: Deploy to TEST
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Create connections.toml dynamically with TEST schema
        run: |
          cat <<EOT > "$GITHUB_WORKSPACE/bronze/migrations/connections.toml"
          [snowflake]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          password = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          EOT

          cp "$GITHUB_WORKSPACE/bronze/migrations/connections.toml" "$GITHUB_WORKSPACE/silver/migrations/"
          cp "$GITHUB_WORKSPACE/bronze/migrations/connections.toml" "$GITHUB_WORKSPACE/gold/migrations/"

      - name: Debug connections.toml content per layer
        run: |
          for layer in bronze silver gold; do
            echo "connections.toml content for $layer:"
            cat "$GITHUB_WORKSPACE/$layer/migrations/connections.toml"
            echo
          done

      - name: Run migrations for bronze, silver, gold layers in TEST
        run: |
          for layer in bronze silver gold; do
            echo "Dry-run migrations for $layer in TEST schema"
            schemachange deploy -c "$GITHUB_WORKSPACE/$layer/migrations/config/schemachange-config.yml" --dry-run --change-history-table APP_DB.TEST.CHANGE_HISTORY --query-tag "schemachange-test"
            echo "Running migrations for $layer in TEST schema"
            schemachange deploy -c "$GITHUB_WORKSPACE/$layer/migrations/config/schemachange-config.yml" --change-history-table APP_DB.TEST.CHANGE_HISTORY --query-tag "schemachange-test"
          done

  deploy-prod:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    environment: prod
    name: Deploy to PROD
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Create connections.toml dynamically with PROD schema
        run: |
          cat <<EOT > "$GITHUB_WORKSPACE/bronze/migrations/connections.toml"
          [snowflake]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          password = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          EOT

          cp "$GITHUB_WORKSPACE/bronze/migrations/connections.toml" "$GITHUB_WORKSPACE/silver/migrations/"
          cp "$GITHUB_WORKSPACE/bronze/migrations/connections.toml" "$GITHUB_WORKSPACE/gold/migrations/"

      - name: Debug connections.toml content per layer
        run: |
          for layer in bronze silver gold; do
            echo "connections.toml content for $layer:"
            cat "$GITHUB_WORKSPACE/$layer/migrations/connections.toml"
            echo
          done

      - name: Run migrations for bronze, silver, gold layers in PROD
        run: |
          for layer in bronze silver gold; do
            echo "Dry-run migrations for $layer in PROD schema"
            schemachange deploy -c "$GITHUB_WORKSPACE/$layer/migrations/config/schemachange-config.yml" --dry-run --change-history-table APP_DB.PROD.CHANGE_HISTORY --query-tag "schemachange-prod"
            echo "Running migrations for $layer in PROD schema"
            schemachange deploy -c "$GITHUB_WORKSPACE/$layer/migrations/config/schemachange-config.yml" --change-history-table APP_DB.PROD.CHANGE_HISTORY --query-tag "schemachange-prod"
          done
