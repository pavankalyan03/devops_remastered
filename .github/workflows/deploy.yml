name: Deploy Migrations

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        layer: [bronze, silver, gold]


    if: github.ref_name == 'dev'
    environment: dev
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ACCOUNTADMIN
      SNOWFLAKE_WAREHOUSE: COMPUTE_WH
      SNOWFLAKE_DATABASE: BRONZE
      SNOWFLAKE_SCHEMA: DEV

    

    name: Deploy to DEV
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Write connections for bronze/silver/gold
        run: |
          # bronze
          mkdir -p bronze/migrations/config
          cat > bronze/migrations/config/connections.toml <<EOF
          [snowflake]
          account   = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user      = "${{ secrets.SNOWFLAKE_USER }}"
          password  = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          role      = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database  = "BRONZE"
          schema    = "DEV"
          EOF
          chmod 600 bronze/migrations/config/connections.toml

          # silver
          mkdir -p silver/migrations/config
          cat > silver/migrations/config/connections.toml <<EOF
          [snowflake]
          account   = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user      = "${{ secrets.SNOWFLAKE_USER }}"
          password  = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          role      = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database  = "SILVER"
          schema    = "DEV"
          EOF
          chmod 600 silver/migrations/config/connections.toml

          # gold
          mkdir -p gold/migrations/config
          cat > gold/migrations/config/connections.toml <<EOF
          [snowflake]
          account   = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user      = "${{ secrets.SNOWFLAKE_USER }}"
          password  = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          role      = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database  = "GOLD"
          schema    = "DEV"
          EOF
          chmod 600 gold/migrations/config/connections.toml

      - name: Debug connections.toml content per layer
        run: |
          for layer in bronze silver gold; do
            echo "connections.toml for $layer:"
            cat "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml"
          done

      - name: Deploy to ${{ matrix.layer }}
        run: |
          schemachange deploy \
            -f "$GITHUB_WORKSPACE/${{ matrix.layer }}/migrations" \
            --config-folder "$GITHUB_WORKSPACE/${{ matrix.layer }}/migrations/config" \
            --config-file-name schemachange-config.yml \
            --connections-file-path "$GITHUB_WORKSPACE/${{ matrix.layer }}/migrations/config/connections.toml" \
            --connection-name snowflake \
            --change-history-table "${{ matrix.layer | upper }}.DEV.CHANGE_HISTORY" \
            --query-tag "schemachange-${{ matrix.layer }}" \
            --verbose

      # - name: Run migrations 

      #   run: |
      #     for layer in bronze silver gold; do
      #       echo "Dry-run migrations for $layer in DEV schema"
      #       schemachange deploy \
      #         --config-folder "$GITHUB_WORKSPACE/$layer/migrations/config" \
      #         --config-file-name schemachange-config.yml \
      #         --connections-file-path "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml" \
      #         --connection-name snowflake \
      #         --modules-folder "$GITHUB_WORKSPACE/$layer/migrations/scripts" \
      #         --change-history-table BRONZE.DEV.CHANGE_HISTORY \
      #         --dry-run
      #         --query-tag "schemachange-dev"
      #       echo "Running migrations for $layer in DEV schema"
      #       schemachange deploy \
      #         --config-folder "$GITHUB_WORKSPACE/$layer/migrations/config" \
      #         --config-file-name schemachange-config.yml \
      #         --connections-file-path "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml" \
      #         --connection-name snowflake \
      #         --modules-folder "$GITHUB_WORKSPACE/$layer/migrations/scripts" \
      #         --change-history-table BRONZE.DEV.CHANGE_HISTORY \
      #         --query-tag "schemachange-dev"
      #     done

  deploy-test:
    runs-on: ubuntu-latest
    if: github.ref_name == 'test'
    environment: test
    name: Deploy to TEST
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Debug connections.toml content per layer
        run: |
          for layer in bronze silver gold; do
            echo "connections.toml for $layer:"
            cat "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml"
          done

      - name: Run migrations for bronze, silver, gold layers
        run: |
          for layer in bronze silver gold; do
            echo "Dry-run migrations for $layer in TEST schema"
            schemachange deploy \
              --config-folder "$GITHUB_WORKSPACE/$layer/migrations" \
              --config-file-name config/schemachange-config.yml \
              --connections-file-path "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml" \
              --connection-name snowflake \
              --dry-run \
              --change-history-table APP_DB.TEST.CHANGE_HISTORY \
              --query-tag "schemachange-test"
            echo "Running migrations for $layer in TEST schema"
            schemachange deploy \
              --config-folder "$GITHUB_WORKSPACE/$layer/migrations" \
              --config-file-name config/schemachange-config.yml \
              --connections-file-path "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml" \
              --connection-name snowflake \
              --change-history-table APP_DB.TEST.CHANGE_HISTORY \
              --query-tag "schemachange-test"
          done

  deploy-prod:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    environment: prod
    name: Deploy to PROD
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Debug connections.toml content per layer
        run: |
          for layer in bronze silver gold; do
            echo "connections.toml for $layer:"
            cat "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml"
          done

      - name: Run migrations for bronze, silver, gold layers
        run: |
          for layer in bronze silver gold; do
            echo "Dry-run migrations for $layer in PROD schema"
            schemachange deploy \
              --config-folder "$GITHUB_WORKSPACE/$layer/migrations" \
              --config-file-name config/schemachange-config.yml \
              --connections-file-path "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml" \
              --connection-name snowflake \
              --dry-run \
              --change-history-table APP_DB.PROD.CHANGE_HISTORY \
              --query-tag "schemachange-prod"
            echo "Running migrations for $layer in PROD schema"
            schemachange deploy \
              --config-folder "$GITHUB_WORKSPACE/$layer/migrations" \
              --config-file-name config/schemachange-config.yml \
              --connections-file-path "$GITHUB_WORKSPACE/$layer/migrations/config/connections.toml" \
              --connection-name snowflake \
              --change-history-table APP_DB.PROD.CHANGE_HISTORY \
              --query-tag "schemachange-prod"
          done
